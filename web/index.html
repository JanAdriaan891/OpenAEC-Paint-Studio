<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#36363e"><title>OpenAEC Paint Studio</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1eeea}canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}#loading{position:absolute;inset:0;display:grid;place-items:center;font:16px system-ui;color:#36363e}#loading.hidden{display:none}#paint-download{position:fixed;inset:0;display:grid;place-items:center;background:#0006;font:14px system-ui;color:#36363e}#paint-download section{width:min(360px,calc(100vw - 64px));padding:24px;background:#faf9f6;border-radius:10px;box-shadow:0 12px 36px #0004}#paint-download a,#paint-download button{display:inline-block;margin:12px 8px 0 0;padding:9px 15px;border:1px solid #a1a1aa;border-radius:5px;font:inherit;text-decoration:none;color:#36363e;background:#fff;cursor:pointer}#paint-download a{background:#d97706;color:white;border-color:#d97706}#paint-download p{overflow-wrap:anywhere}</style></head>
