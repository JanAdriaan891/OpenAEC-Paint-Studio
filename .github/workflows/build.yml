name: Rust builds and verification
on:
  push:
    branches: [main, rust-migration, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev desktop-file-utils xvfb
      - run: cargo fmt -p paint-core -p paint-services -p openaec-paint-studio -p paint-tools --check
      - run: cargo test --workspace --locked
        env:
          PAINT_SCREENSHOTS: ${{ github.workspace }}/artifacts/screenshots
      - run: cargo build --workspace --release --locked
      - run: xvfb-run -a python3 tests/native-smoke.py target/release --gui
      - run: target/release/paint-release package-linux artifacts/releases
      - run: target/release/paint-release package-services artifacts/releases target/release linux-x64
      - name: Portable AppImage with bundled desktop libraries
        run: |
          curl --fail --location --retry 3 https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o /tmp/linuxdeploy.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 OUTPUT="$PWD/artifacts/releases/OpenAEC-Paint-Studio_2026.44.0_x86_64.AppImage" /tmp/linuxdeploy.AppImage --appdir 'artifacts/releases/OpenAEC Paint Studio.AppDir' --output appimage
      - name: Validate package contents and image associations
        run: |
          dpkg-deb --info artifacts/releases/*.deb
          desktop-file-validate packaging/linux/org.openaec.paint-studio.desktop
          test -x 'artifacts/releases/deb-root/usr/bin/paint-mcp'
          test -f 'artifacts/releases/deb-root/usr/share/mime/packages/openaec-paint-studio.xml'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            artifacts/releases/*.deb
            artifacts/releases/*.AppImage
            artifacts/releases/*.tar.gz
            target/release/paint-release
      - uses: actions/upload-artifact@v4
        with:
          name: rust-ui-screenshots
          path: artifacts/screenshots/*.png
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --workspace --release --locked
      - run: python tests/native-smoke.py target/release
      - name: Create NSIS installer with image Open With associations
        shell: pwsh
        run: |
          $env:MAKENSIS = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $env:MAKENSIS)) {
            choco install nsis --no-progress --yes
            if ($LASTEXITCODE -notin 0,3010) { throw 'Could not install NSIS' }
          }
          $candidates = @('C:\Program Files (x86)\NSIS\makensis.exe','C:\Program Files\NSIS\makensis.exe')
          $env:MAKENSIS = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$env:MAKENSIS) { $env:MAKENSIS = (Get-Command makensis.exe -ErrorAction Stop).Source }
          target/release/paint-release.exe package-windows artifacts/releases
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          target/release/paint-release.exe package-services artifacts/releases target/release windows-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Silent installer and file association smoke test
        shell: pwsh
        run: |
          $installer = (Get-ChildItem artifacts/releases/*setup.exe).FullName
          $installPath = Join-Path $env:RUNNER_TEMP 'PaintInstallCheck'
          $result = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$installPath" -Wait -PassThru
          if ($result.ExitCode) { throw "Installer failed: $($result.ExitCode)" }
          foreach ($name in 'openaec-paint-studio.exe','paint-api.exe','paint-mcp.exe') {
            if (!(Test-Path (Join-Path $installPath $name))) { throw "Missing $name" }
          }
          $command = (Get-Item 'HKCU:\Software\Classes\OpenAEC.PaintStudio.Image\shell\open\command').GetValue('')
          if (!$command.Contains('openaec-paint-studio.exe')) { throw 'Image open command missing' }
          if (!(Get-ItemProperty 'HKCU:\Software\Classes\.png\OpenWithProgids').PSObject.Properties.Name.Contains('OpenAEC.PaintStudio.Image')) { throw 'PNG association missing' }
          Start-Process -FilePath (Join-Path $installPath 'uninstall.exe') -ArgumentList '/S' -Wait
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            artifacts/releases/*.exe
            artifacts/releases/*.tar.gz
  macos-binaries:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ matrix.target }}
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/openaec-paint-studio
            target/${{ matrix.target }}/release/paint-api
            target/${{ matrix.target }}/release/paint-mcp
            target/${{ matrix.target }}/release/paint-release
  macos:
    needs: macos-binaries
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release
      - uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release
      - name: Universal app and services for Apple Silicon and Intel
        run: |
          chmod +x target/*-apple-darwin/release/*
          mkdir -p target/universal-release
          for bin in openaec-paint-studio paint-api paint-mcp; do
            lipo -create "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin" -output "target/universal-release/$bin"
            lipo "target/universal-release/$bin" -verify_arch arm64 x86_64
            chmod +x "target/universal-release/$bin"
          done
          python3 tests/native-smoke.py target/universal-release
          target/aarch64-apple-darwin/release/paint-release package-macos artifacts/releases target/universal-release
          target/aarch64-apple-darwin/release/paint-release package-services artifacts/releases target/universal-release macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            artifacts/releases/*.dmg
            artifacts/releases/*.tar.gz
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build -p openaec-paint-studio --lib --release --locked --target wasm32-unknown-unknown --features web
      - name: Generate matching Wasm bindings
        run: |
          curl --fail --location --retry 3 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz -o /tmp/wasm-bindgen.tar.gz
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          mkdir -p web-dist/pkg artifacts/releases
          /tmp/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl/wasm-bindgen target/wasm32-unknown-unknown/release/openaec_paint_studio.wasm --target web --out-dir web-dist/pkg
          cp web/index.html web-dist/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser interaction and persistence smoke test
        run: |
          python3 -m http.server 49325 --bind 127.0.0.1 --directory web-dist >/tmp/paint-web.log 2>&1 &
          node tests/web-smoke.mjs
      - run: tar -czf artifacts/releases/OpenAEC-Paint-Studio_2026.44.0_web.tar.gz -C web-dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: artifacts/releases/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/browser/*.png
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Complete corresponding source with locked Cargo dependencies
        run: |
          mkdir -p artifacts/source artifacts/releases
          git archive HEAD | tar -x -C artifacts/source
          cargo vendor --locked --versioned-dirs artifacts/source/vendor-crates > /tmp/paint-vendor-config
          mkdir -p artifacts/source/.cargo
          cp /tmp/paint-vendor-config artifacts/source/.cargo/config.toml
          # cargo vendor prints a repository-relative path. The archive builds from its own root.
          sed -i 's|artifacts/source/vendor-crates|vendor-crates|' artifacts/source/.cargo/config.toml
          tar -czf artifacts/releases/OpenAEC-Paint-Studio_2026.44.0_source.tar.gz -C artifacts/source .
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: artifacts/releases/*.tar.gz
